<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 대화형 대시보드 샘플</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #60a5fa;
            --primary-hover: #3b82f6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .theme-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .theme-btn:hover {
            border-color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card h2 {
            font-size: 1.15rem;
            color: var(--primary);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        /* 카운터 스타일 */
        .counter-display {
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            margin: 0.5rem 0;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
        }

        button.action-btn {
            flex: 1;
            padding: 0.6rem;
            border: none;
            border-radius: 6px;
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        button.action-btn:hover {
            background-color: var(--primary-hover);
        }

        button.reset-btn {
            background-color: var(--text-sub);
        }

        /* 할 일 목록 스타일 */
        .todo-input-group {
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            color: var(--text-main);
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        ul.todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
        }

        ul.todo-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.8rem;
            background: var(--bg-color);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        ul.todo-list li .del-btn {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* 실시간 정보 카드의 타임스탬프 */
        .info-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .info-label {
            color: var(--text-sub);
        }

        .info-value {
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>JavaScript 대화형 샘플</h1>
        <button class="theme-btn" id="themeToggleBtn">🌙 다크 모드</button>
    </header>

    <div class="grid">
        <!-- 카운터 카드 -->
        <div class="card">
            <h2>1. 카운터 기능</h2>
            <div class="counter-display" id="counterValue">0</div>
            <div class="btn-group">
                <button class="action-btn" id="decreaseBtn">- 감소</button>
                <button class="action-btn reset-btn" id="resetBtn">초기화</button>
                <button class="action-btn" id="increaseBtn">+ 증가</button>
            </div>
        </div>

        <!-- 실시간 데이터 카드 -->
        <div class="card">
            <h2>2. 실시간 정보 및 이벤트</h2>
            <div class="info-item">
                <span class="info-label">현재 시각:</span>
                <span class="info-value" id="currentTime">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">마우스 위치:</span>
                <span class="info-value" id="mousePos">X: 0, Y: 0</span>
            </div>
            <div class="info-item">
                <span class="info-label">입력 글자 수:</span>
                <span class="info-value" id="charCount">0 자</span>
            </div>
        </div>
    </div>

    <!-- 미니 Todo 리스트 카드 -->
    <div class="card">
        <h2>3. 간단한 할 일 목록 (To-Do List)</h2>
        <div class="todo-input-group">
            <input type="text" id="todoInput" placeholder="새 할 일을 입력하고 Enter를 누르세요..." />
            <button class="action-btn" id="addTodoBtn" style="flex: none; width: 80px;">추가</button>
        </div>
        <ul class="todo-list" id="todoList">
            <!-- 자바스크립트로 항목이 추가됩니다 -->
        </ul>
    </div>
</div>

<script>
    // ==========================================
    // 1. 다크 모드 토글 (테마 변경)
    // ==========================================
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    let isDarkMode = false;

    themeToggleBtn.addEventListener('click', () => {
        isDarkMode = !isDarkMode;
        if (isDarkMode) {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggleBtn.textContent = '☀️ 라이트 모드';
        } else {
            document.documentElement.removeAttribute('data-theme');
            themeToggleBtn.textContent = '🌙 다크 모드';
        }
    });

    // ==========================================
    // 2. 카운터 (증가/감소/초기화)
    // ==========================================
    let count = 0;
    const counterValue = document.getElementById('counterValue');
    const increaseBtn = document.getElementById('increaseBtn');
    const decreaseBtn = document.getElementById('decreaseBtn');
    const resetBtn = document.getElementById('resetBtn');

    function updateCounterDisplay() {
        counterValue.textContent = count;
        if (count > 0) counterValue.style.color = 'var(--accent-green)';
        else if (count < 0) counterValue.style.color = 'var(--accent-red)';
        else counterValue.style.color = 'var(--text-main)';
    }

    increaseBtn.addEventListener('click', () => { count++; updateCounterDisplay(); });
    decreaseBtn.addEventListener('click', () => { count--; updateCounterDisplay(); });
    resetBtn.addEventListener('click', () => { count = 0; updateCounterDisplay(); });

    // ==========================================
    // 3. 실시간 시각 및 이벤트 모니터링
    // ==========================================
    const currentTimeEl = document.getElementById('currentTime');
    const mousePosEl = document.getElementById('mousePos');
    const charCountEl = document.getElementById('charCount');

    // 시계 업데이트 함수 (1초마다 실행)
    function updateClock() {
        const now = new Date();
        currentTimeEl.textContent = now.toLocaleTimeString('ko-KR');
    }
    setInterval(updateClock, 1000);
    updateClock(); // 초기 호출

    // 마우스 이동 추적
    window.addEventListener('mousemove', (e) => {
        mousePosEl.textContent = `X: ${e.clientX}, Y: ${e.clientY}`;
    });

    // ==========================================
    // 4. To-Do List 기능 (DOM 추가/삭제 & 글자수 세기)
    // ==========================================
    const todoInput = document.getElementById('todoInput');
    const addTodoBtn = document.getElementById('addTodoBtn');
    const todoList = document.getElementById('todoList');

    // 입력창 글자 수 감지
    todoInput.addEventListener('input', (e) => {
        charCountEl.textContent = `${e.target.value.length} 자`;
    });

    // 할 일 추가 함수
    function addTodo() {
        const text = todoInput.value.trim();
        if (text === '') return;

        const li = document.createElement('li');
        li.innerHTML = `
            <span>${text}</span>
            <button class="del-btn">&times;</button>
        `;

        // 삭제 버튼 이벤트 연결
        li.querySelector('.del-btn').addEventListener('click', () => {
            li.remove();
        });

        todoList.appendChild(li);
        todoInput.value = '';
        charCountEl.textContent = '0 자';
    }

    addTodoBtn.addEventListener('click', addTodo);
    todoInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addTodo();
    });

    // 기본 초기 샘플 항목 추가
    todoInput.value = 'GitHub Pages에 배포해보기';
    addTodo();
</script>
</body>
</html>
